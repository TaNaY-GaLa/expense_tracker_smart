{% extends "base.html" %}
{% block title %}Write Post — Blog{% endblock %}
{% block content %}

<div class="hero-banner py-3 mb-4">
  <div class="container">
    <h4 class="mb-0" style="color:var(--cream)">✍️ Write a New Post</h4>
    <small style="color:rgba(245,230,200,0.75)">Share your thoughts</small>
  </div>
</div>

<div class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow-sm" style="border:1px solid rgba(107,66,38,0.15);border-radius:12px;">
        <div class="card-body p-4">

          {% if error %}
          <div class="alert alert-danger py-2 small">{{ error }}</div>
          {% endif %}

          <form method="POST" action="{% url 'blog_create' %}">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label fw-semibold" style="color:var(--brown-dark)">Post Title</label>
              <input type="text" name="title" class="form-control"
                     placeholder="Enter a catchy title..." required
                     value="{{ request.POST.title }}">
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold" style="color:var(--brown-dark)">Content</label>
              <textarea name="content" class="form-control" rows="10"
                        placeholder="Write your post here..." required>{{ request.POST.content }}</textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-brown px-4">
                <i class="bi bi-send me-1"></i>Publish Post
              </button>
              <a href="{% url 'blog_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
