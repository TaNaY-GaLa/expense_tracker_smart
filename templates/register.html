{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-hero">
    <div class="auth-logo-wrap">
      <svg width="40" height="40" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="10" fill="#6B4226"/>
        <text x="18" y="23" text-anchor="middle" font-family="Georgia" font-size="14" font-weight="bold" fill="#F5E6C8">₹</text>
        <circle cx="18" cy="18" r="9" stroke="#D4A96A" stroke-width="1.5" fill="none"/>
      </svg>
      <span class="auth-app-name">Expense Tracker</span>
    </div>
    <p class="auth-tagline">Know Where Your Money Goes</p>
  </div>

  <div class="container py-4 flex-grow-1 d-flex align-items-start justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">
      <div class="auth-card p-4 p-md-5">
        <h4 class="text-center mb-1" style="font-family:var(--font-head);color:var(--brown-dark)">Create Account</h4>
        <p class="text-center text-muted small mb-4">Join and start tracking your expenses</p>

        {% if error %}
        <div class="alert alert-danger py-2 small"><i class="bi bi-exclamation-triangle me-1"></i>{{ error }}</div>
        {% endif %}

        <form id="regForm" method="POST" action="{% url 'register' %}" novalidate>
        {% csrf_token %}
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Username <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="rUser" name="username" placeholder="Min. 3 characters" required>
              </div>
              <div class="invalid-feedback" id="rUserErr"></div>
            </div>
            <div class="col-12">
              <label class="form-label">Email Address <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="rEmail" name="email" placeholder="you@example.com" required>
              </div>
              <div class="invalid-feedback" id="rEmailErr"></div>
            </div>
            <div class="col-12">
              <label class="form-label">Mobile Number <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-phone"></i></span>
                <input type="tel" class="form-control" id="rMobile" name="mobile" placeholder="10-digit mobile" maxlength="10" required>
              </div>
              <div class="invalid-feedback" id="rMobileErr"></div>
              <div class="form-text">Starts with 6–9, 10 digits</div>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="rPass" name="password" placeholder="Min. 6 chars" required>
                <button class="btn btn-outline-secondary" type="button" onclick="tp('rPass')"><i class="bi bi-eye"></i></button>
              </div>
              <div class="invalid-feedback" id="rPassErr"></div>
              <div class="progress mt-2" style="height:5px;border-radius:4px;">
                <div class="progress-bar" id="strengthBar" style="width:0%;transition:width .3s,background .3s;"></div>
              </div>
              <div class="form-text" id="strengthLabel" style="font-size:0.78rem;"></div>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="rConf" placeholder="Re-enter" required>
                <button class="btn btn-outline-secondary" type="button" onclick="tp('rConf')"><i class="bi bi-eye"></i></button>
              </div>
              <div class="invalid-feedback" id="rConfErr"></div>
            </div>
          </div>
          <button type="submit" class="btn btn-brown w-100 py-2 mt-4">
            <i class="bi bi-person-check me-2"></i>Create Account
          </button>
        </form>
        <hr class="my-3" style="border-color:var(--cream-dark)">
        <p class="text-center small mb-0">Already have an account? <a href="{% url 'login' %}" class="auth-link">Login here</a></p>
      </div>
    </div>
  </div>
</div>

<script>
/* ── Task 3: Client-side form validation ─────────────────────────────
   Rules:
   • Username  — 3–20 alphanumeric / underscore characters
   • Email     — standard regex (user@domain.tld)
   • Mobile    — exactly 10 digits, first digit 6–9 (Indian mobile)
   • Password  — minimum 6 characters
   • Confirm   — must match password
   All rules are checked on submit AND live (on blur) for instant feedback.
──────────────────────────────────────────────────────────────────── */

function tp(id) {
  const e = document.getElementById(id);
  e.type = e.type === 'password' ? 'text' : 'password';
}

// ── Validation rules ──
const RULES = {
  rUser:   { re: /^[a-zA-Z0-9_]{3,20}$/, msg: 'Username must be 3–20 alphanumeric characters (letters, digits, _).' },
  rEmail:  { re: /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/, msg: 'Enter a valid email address (e.g. user@example.com).' },
  rMobile: { re: /^[6-9]\d{9}$/, msg: 'Mobile must be exactly 10 digits and start with 6, 7, 8, or 9.' },
  rPass:   { test: v => v.length >= 6, msg: 'Password must be at least 6 characters long.' },
};

function setValid(el, errId) {
  el.classList.remove('is-invalid');
  el.classList.add('is-valid');
  document.getElementById(errId).textContent = '';
}

function setInvalid(el, errId, msg) {
  el.classList.remove('is-valid');
  el.classList.add('is-invalid');
  document.getElementById(errId).textContent = msg;
}

function validateField(id, errId) {
  const el = document.getElementById(id);
  const val = el.value.trim();
  const rule = RULES[id];
  const ok = rule.re ? rule.re.test(val) : rule.test(val);
  ok ? setValid(el, errId) : setInvalid(el, errId, rule.msg);
  return ok;
}

function validateConfirm() {
  const p = document.getElementById('rPass');
  const c = document.getElementById('rConf');
  if (c.value === p.value && c.value.length >= 6) {
    setValid(c, 'rConfErr'); return true;
  }
  setInvalid(c, 'rConfErr', c.value.length === 0 ? 'Please confirm your password.' : 'Passwords do not match.');
  return false;
}

// ── Live (on-blur) validation ──
document.getElementById('rUser').addEventListener('blur',   () => validateField('rUser',   'rUserErr'));
document.getElementById('rEmail').addEventListener('blur',  () => validateField('rEmail',  'rEmailErr'));
document.getElementById('rMobile').addEventListener('blur', () => validateField('rMobile', 'rMobileErr'));
document.getElementById('rPass').addEventListener('blur',   () => validateField('rPass',   'rPassErr'));
document.getElementById('rConf').addEventListener('blur',   validateConfirm);

// ── Allow only digits in mobile field ──
document.getElementById('rMobile').addEventListener('input', function() {
  this.value = this.value.replace(/\D/g, '').slice(0, 10);
});

// ── Strength indicator for password ──
document.getElementById('rPass').addEventListener('input', function() {
  const len = this.value.length;
  const bar = document.getElementById('strengthBar');
  const label = document.getElementById('strengthLabel');
  if (!bar) return;
  if (len === 0)      { bar.style.width='0%'; bar.className='progress-bar'; label.textContent=''; }
  else if (len < 4)   { bar.style.width='25%'; bar.className='progress-bar bg-danger'; label.textContent='Weak'; }
  else if (len < 6)   { bar.style.width='50%'; bar.className='progress-bar bg-warning'; label.textContent='Fair'; }
  else if (len < 10)  { bar.style.width='75%'; bar.className='progress-bar bg-info'; label.textContent='Good'; }
  else                { bar.style.width='100%'; bar.className='progress-bar bg-success'; label.textContent='Strong'; }
});

// ── Submit: validate all fields ──
document.getElementById('regForm').addEventListener('submit', function(e) {
  const u  = validateField('rUser',   'rUserErr');
  const em = validateField('rEmail',  'rEmailErr');
  const mo = validateField('rMobile', 'rMobileErr');
  const p  = validateField('rPass',   'rPassErr');
  const c  = validateConfirm();
  if (!(u && em && mo && p && c)) {
    e.preventDefault();
    // Scroll to first error
    const first = document.querySelector('.is-invalid');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});
</script>
{% endblock %}
